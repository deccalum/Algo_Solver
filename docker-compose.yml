services:
  postgres:
    image: postgres:16-alpine
    container_name: grip_solve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grip_solve
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grip_solve"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: grip_solve-api
    restart: unless-stopped
    ports:
      - "18000:18000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/grip_solve
      - DOCKER_CONTAINER=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:18000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: grip_solve-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
