syntax = "proto3";

package algosolver.bridge.v1;

option java_package = "com.algosolver.grpc";
option java_multiple_files = true;
option java_outer_classname = "AlgSolverProto";

// -----------------------------------------------------------------------------
// SECTION 1: ALGORITHM INPUT
// -----------------------------------------------------------------------------

message Generation {
    double budget = 1;
    double space = 2;
	double min_price = 3;
	double max_price = 4;
	double min_size = 5;
	double max_size = 6;
	repeated Zone price_zones = 7;
	repeated Zone size_zones = 8;
	ZoneDefaults zone_defaults = 9;
}

message ZoneDefaults {
	string mode = 1;
	double span_share = 2;
	int32 resolution = 3;
	double bias = 4;
	double step = 5;
}

message Zone {
	string mode = 1;
	double span_share = 2;
	int32 resolution = 3;
	double bias = 4;
	double step = 5;
}

message Demand {
	double base_demand = 1;
	double price_scale = 2;
	double size_scale = 3;
	double price_sensitivity = 4;
	double size_sensitivity = 5;
	double noise = 6;
	double min_demand = 7;
	double max_demand = 8;
}

message Markup {
	double base_rate = 1;
	double price_scale = 2;
	double max_rate = 3;
	double noise = 4;
	double price_divisor = 5;
	double min_rate = 6;
	double max_rate_clamp = 7;
}

message TransitMode {
	string name = 1;
	float capacity = 2;
	float base_cost = 3;
	float max_value_density = 4;
	float min_weight_class = 5;
}

message Transit {
	TransitMode courier              		= 1;
	TransitMode pallet              		= 2;
	TransitMode container            		= 3;
	float       min_capacity_epsilon 		= 4;
	float       weight_volume_ratio  		= 5;
	float       origin						= 6;
	ZoneSpec    origin_zone          		= 7;
}

message TransitResult {
	string mode 	= 1;
	float capacity 	= 2;
	float cost 		= 3;
}

message Logistics {
    float min_size_log    = 1;
    float penalty_factor  = 2;
    float max_difficulty  = 3;
    float optimal         = 4;
    float base_cost       = 5;
}

message Stock {
	double base_stock 			= 1;
	int32 min_stock 			= 2;
	double noise 				= 3;
	int32 infinite_stock_value 	= 4;
	double infinite_chance_base = 5;
	double infinite_decay_scale = 6;
	double infinite_decay_size 	= 7;
	double price_scale 			= 8;
	double size_scale 			= 9;
	double price_sensitivity 	= 10;
	double size_sensitivity 	= 11;
	double min_price_norm 		= 12;
	double min_size_norm 		= 13;
	double min_scale 			= 14;
}

message Guardrails {
	double min_span = 1;
	double min_step = 2;
	int32 min_resolution = 3;
	double min_bias = 4;
	double min_safe_start = 5;
	int32 min_count = 6;
	int32 round_min = 7;
}

message AppConfig {
	Generation generation = 1;
	Demand demand = 2;
	Markup markup = 3;
	Transit transit = 4;
	Logistics logistics = 5;
	Stock stock = 6;
	Guardrails guardrails = 7;
}

// -----------------------------------------------------------------------------
// SECTION 2: RUNTIME PIPELINE PAYLOADS
// -----------------------------------------------------------------------------

message Product {
	string id = 1;
	int32 price = 2;
	int32 size = 3;
	double logistics = 4;
	string transit = 5;
	double transit_size = 6;
	double transit_cost = 7;
	double demand = 8;
	double markup = 9;
	int32 stock = 10;
}

message GenerateCatalogRequest {
	AppConfig config = 1;
}

message GenerateCatalogResponse {
	repeated Product products = 1;
	int64 generated_count = 2;
}

message OptimizeCatalogRequest {
	AppConfig			config 		= 1;
	repeated Product 	products 	= 2;
}

message OptimizeCatalogResponse {
	string status = 1;
	double objective_value = 2;
	int64 selected_count = 3;
}

message RunPipelineRequest {
	AppConfig config = 1;
}

message RunPipelineResponse {
	string status = 1;
	double objective_value = 2;
	int64 generated_count = 3;
	int64 selected_count = 4;
}

// -----------------------------------------------------------------------------
// SECTION 3: LIGHTWEIGHT ESTIMATION
// -----------------------------------------------------------------------------

message ZoneSpec {
	string mode = 1;
	double span_share = 2;
	int32 resolution = 3;
	double step = 4;
	double bias = 5;
}

message EstimateRequest {
	double price_min = 1;
	double price_max = 2;
	double size_min = 3;
	double size_max = 4;
	repeated ZoneSpec price_zones = 5;
	repeated ZoneSpec size_zones = 6;
}

message EstimateResponse {
	int64 estimated_products = 1;
	string strategy = 2;
}

service ProductEstimator {
	rpc GenerateCatalog(GenerateCatalogRequest) returns (GenerateCatalogResponse);
	rpc OptimizeCatalog(OptimizeCatalogRequest) returns (OptimizeCatalogResponse);
	rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
	rpc EstimateProducts(EstimateRequest) returns (EstimateResponse);
}
